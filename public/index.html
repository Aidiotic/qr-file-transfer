<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
<meta name="color-scheme" content="light dark" />
<meta name="theme-color" content="#F9F8F6" />
<title>Beam — QR File Transfer</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>⚡</text></svg>" />
<script>
// Resolve display prefs before first paint. This must stay inline and ahead of
// the stylesheet: /app.js loads at end of <body>, so applying the theme there
// would flash the wrong palette. Stores intent ("system"), applies a concrete
// value — otherwise "System" would stop tracking the OS.
(function () {
  var get = function (k, allowed, dflt) {
    try { var v = localStorage.getItem(k); return allowed.indexOf(v) > -1 ? v : dflt; }
    catch (e) { return dflt; }
  };
  var m = function (q) { return window.matchMedia && window.matchMedia(q).matches; };
  var theme = get('beam.theme', ['system', 'light', 'dark'], 'system');
  var motion = get('beam.motion', ['system', 'full', 'reduced'], 'system');
  var d = document.documentElement;
  d.dataset.theme = theme === 'system' ? (m('(prefers-color-scheme: dark)') ? 'dark' : 'light') : theme;
  d.dataset.density = get('beam.density', ['compact', 'default', 'large'], 'default');
  d.dataset.motion = motion === 'system' ? (m('(prefers-reduced-motion: reduce)') ? 'reduced' : 'full') : motion;
  var tc = document.querySelector('meta[name="theme-color"]');
  if (tc) tc.setAttribute('content', d.dataset.theme === 'dark' ? '#1C1A1A' : '#F9F8F6');
})();
</script>
<link rel="stylesheet" href="/style.css" />
</head>
<body>
  <main class="wrap">
    <header class="head">
      <div class="brand"><span class="bolt" aria-hidden="true">⚡</span> Beam</div>
      <div class="head-right">
        <p class="pill" id="pill" role="status" aria-live="polite"><span class="dot" id="dot" aria-hidden="true"></span><span id="pill-text">Starting…</span></p>
        <button type="button" class="icon-btn" id="settings-open" aria-haspopup="dialog" aria-label="Settings">
          <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" aria-hidden="true">
            <circle cx="12" cy="12" r="3"/>
            <path d="M12 2v3M12 19v3M4.2 4.2l2.1 2.1M17.7 17.7l2.1 2.1M2 12h3M19 12h3M4.2 19.8l2.1-2.1M17.7 6.3l2.1-2.1"/>
          </svg>
        </button>
      </div>
    </header>

    <!-- PAIRING -->
    <section id="pair" class="pane center hidden">
      <div class="qr-frame">
        <img id="qr-img" alt="QR code to pair your phone" />
        <div class="scanline"></div>
      </div>
      <h2 class="pair-title">Scan to connect</h2>
      <p class="sub">Point your phone's camera at this code — files travel directly between your devices, never through the cloud.</p>
      <button class="ghost-link" id="copy-link">Copy link instead</button>
    </section>

    <!-- CONNECTING (peer) -->
    <section id="connecting" class="pane center hidden">
      <div class="spinner"></div>
      <h2 class="pair-title">Connecting…</h2>
    </section>

    <!-- TRANSFER -->
    <section id="transfer" class="pane hidden">
      <div class="drop" id="drop">
        <input type="file" id="file-input" multiple hidden />
        <div class="drop-inner">
          <div class="drop-icon">↑</div>
          <div class="drop-main">Drop files, or tap to browse</div>
          <div class="drop-sub">Paste works too</div>
        </div>
      </div>

      <div class="quick-row">
        <button class="chip" id="text-toggle">＋ Text or link</button>
        <label class="chip toggle" id="auto-chip">
          <input type="checkbox" id="auto-dl" />
          <span>Auto‑save</span>
        </label>
      </div>

      <div class="compose hidden" id="compose">
        <textarea id="text-input" rows="1" placeholder="Paste a link or note…"></textarea>
        <button id="send-text" class="btn small">Send</button>
        <button id="close-compose" class="icon-btn" aria-label="Cancel" type="button">✕</button>
      </div>

      <section class="list-block hidden" id="activity-block">
        <h3 class="list-head">Activity</h3>
        <ul class="list" id="activity-list"></ul>
      </section>
    </section>
  </main>

  <div class="success-flash hidden" id="success-flash">
    <div class="success-circle">
      <svg width="30" height="30" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="M4 12l5 5L20 6"/></svg>
    </div>
  </div>

  <!-- Native <dialog>: focus trap, Esc-to-close, ::backdrop and inert background
       come free. Radio groups give arrow-key navigation with zero JS. -->
  <dialog class="sheet" id="settings" aria-labelledby="settings-title">
    <div class="sheet-head">
      <h2 class="sheet-title" id="settings-title">Settings</h2>
      <button type="button" class="icon-btn" id="settings-close" aria-label="Close settings">✕</button>
    </div>

    <fieldset class="opt">
      <legend class="opt-label">Appearance</legend>
      <div class="seg">
        <input type="radio" name="theme" id="theme-system" value="system" /><label for="theme-system">System</label>
        <input type="radio" name="theme" id="theme-light"  value="light"  /><label for="theme-light">Light</label>
        <input type="radio" name="theme" id="theme-dark"   value="dark"   /><label for="theme-dark">Dark</label>
      </div>
    </fieldset>

    <fieldset class="opt">
      <legend class="opt-label">Density</legend>
      <div class="seg">
        <input type="radio" name="density" id="den-compact" value="compact" /><label for="den-compact">Compact</label>
        <input type="radio" name="density" id="den-default" value="default" /><label for="den-default">Default</label>
        <input type="radio" name="density" id="den-large"   value="large"   /><label for="den-large">Large</label>
      </div>
    </fieldset>

    <fieldset class="opt">
      <legend class="opt-label">Motion</legend>
      <div class="seg">
        <input type="radio" name="motion" id="mo-system"  value="system"  /><label for="mo-system">System</label>
        <input type="radio" name="motion" id="mo-full"    value="full"    /><label for="mo-full">Full</label>
        <input type="radio" name="motion" id="mo-reduced" value="reduced" /><label for="mo-reduced">Reduced</label>
      </div>
    </fieldset>
  </dialog>

  <div class="toast" id="toast" role="status" aria-live="polite" aria-atomic="true"></div>
  <script src="/qrcode.min.js"></script>
  <script src="/app.js"></script>
</body>
</html>
